schema: spec-driven

context: |
  Project: llm-wiki
  A compounding personal knowledge base built entirely through conversation with Claude.
  You tell Claude about something you read or a thought you had; Claude organises it
  into cross-linked wiki pages and keeps an index, so knowledge compounds instead of
  piling up as disconnected notes.

  Origin: adapted from Andrej Karpathy's personal LLM-wiki pattern (a CLAUDE.md schema,
  markdown pages, index-first navigation, no vector database). See
  openspec/explorations/ for the comparison and the rationale behind the tier split
  below.

  Two tiers, built in order:

  Tier 1 — Starting point (build first, validate by using it yourself)
    A technical user runs this today with zero custom software: a wiki folder, the
    defaults/CLAUDE.md and defaults/schema.md files, and Claude Desktop or Claude Code
    connected to that folder via the official filesystem MCP server
    (@modelcontextprotocol/server-filesystem) or direct local file access. Ingest and
    capture are Claude following defaults/CLAUDE.md inside the chat session — no
    separate backend, no API calls outside the conversation, no CLI.

  Tier 2 — Non-technical enablement (build only after Tier 1 is validated by real use)
    Removes every piece of Tier 1 setup that assumes technical comfort: manual MCP
    config, git, terminal use. Scope and mechanism are intentionally undecided — see
    openspec/specs/onboarding/spec.md. Don't infer a CLI, a Python package, or any
    other implementation from this document until that spec decides it.

  Product language (use these terms consistently across all specs):
  - "ingest" not "import" or "process" — for adding an external source to the wiki
  - "capture" not "create" or "write" — for adding a personal note
  - "lint" not "validate" or "check" — for the ingest quality gate
  - "index" not "table of contents" or "summary" — for index.md
  - "wiki" not "knowledge base" or "vault" in user-facing text
  - "page" not "file" or "document" in user-facing text

  Wiki directory structure (user-owned, separate from project code, same in both tiers):
    wiki-root/
      CLAUDE.md       ← agent operational spec (copied from defaults/ on setup)
      schema.md       ← human schema reference (copied from defaults/ on setup)
      index.md        ← master navigation index, auto-maintained
      entities/       ← named things: people, companies, tools, places
      concepts/       ← abstract ideas, frameworks, methodologies
      sources/        ← external inputs: articles, books, papers, podcasts
      synthesis/      ← cross-cutting analyses spanning 2+ sources
      notes/          ← personal capture: daily notes, meetings, fleeting thoughts

  Architectural constraints (non-negotiable, both tiers):
  - No vector embeddings. The no-vector bet is intentional. A BM25 search primitive may
    be added later if real usage shows the index alone doesn't scale — not before.
  - Index-first navigation: Claude reads index.md before opening individual pages.
  - No custom backend, server, or API-calling service in Tier 1. If a spec proposes one,
    it belongs in Tier 2 and must justify why chat + filesystem access can't do it.
  - The wiki is a separate directory from the project code.

  Non-technical user baseline (Tier 2 target, not assumed in Tier 1):
  - Assume the user knows what Claude Desktop is but not what MCP or YAML mean.
  - The primary interaction is: paste a URL or describe a thought in chat.
  - Error messages must be in plain English with a suggested next action.

rules:
  specs:
    - Write requirements as observable user outcomes, not implementation steps.
    - Use wiki product language (ingest, capture, lint, index, page) throughout.
    - State which tier a requirement belongs to. Tier 2 requirements must not assume a
      specific tech stack, language, or packaging format unless a Tier 2 spec has
      already decided it.
    - Don't add process (severity taxonomies, lifecycle fields, structured workflows)
      that hasn't been shown necessary by actually using the wiki. If you're speculating
      about a future failure mode, say so explicitly and mark it deferred.
    - Every spec must include a "User-facing behaviour" section and a "Constraints" section.
  design:
    - No vector embeddings in Tier 1.
    - Tier 1 has no custom server or backend — Claude interacts with the wiki directly
      through filesystem access. Don't design a bespoke MCP tool that only re-implements
      generic file operations (ls/read/grep) already available.
    - Tier 2's tech stack is not yet decided. Do not default to Python, Node, or any
      other stack without an explicit Tier 2 spec making that call.
  tasks:
    - Each task must be independently verifiable without running a full system.
    - Tier 1 tasks must be verifiable using only Claude Desktop/Claude Code and a local
      folder — no build step.
    - Don't create Tier 2 tasks until Tier 1 has been used for real and its actual gaps
      (not guessed ones) are known.
